<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moving Gradient Border Text</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
      }
      svg {
        width: 80%;
        height: auto;
      }
      text {
        font-size: 15vmin;
        font-weight: 900;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: none; /* make sure no fill */
        stroke-width: 1.5; /* thin stroke */
      }

      .stroke {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: draw 6s linear infinite;
      }

      @keyframes draw {
        0% {
          stroke-dashoffset: 2000;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff00cc" />
          <stop offset="50%" stop-color="#3333ff" />
          <stop offset="100%" stop-color="#00ffcc" />
        </linearGradient>
      </defs>

      <!-- ONLY ONE TEXT ELEMENT -->
      <text class="stroke" x="50%" y="50%" stroke="url(#gradient)">Vibek</text>
    </svg>
  </body>
</html>
